<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Foundry Strike — Proof Foundry Brand Intro Prototype</title>
  <meta name="description" content="A local Proof Foundry brand intro prototype: forged mark, stamped proof, and final lockup." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0B0F14" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      --foundry-bg: #07090d;
      --foundry-panel: rgba(10, 14, 20, 0.9);
      --foundry-slate: #12171d;
      --foundry-line: rgba(88, 104, 118, 0.45);
      --foundry-bronze: #d0a161;
      --foundry-bronze-dark: #7d5428;
      --foundry-gold: #e0bc7b;
      --foundry-ash: #98a5b3;
      --foundry-heat: #ff6a1f;
      --foundry-heat-soft: rgba(255, 106, 31, 0.22);
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #f4f7f8;
      background:
        radial-gradient(circle at 20% 18%, rgba(224, 188, 123, 0.08), transparent 28rem),
        radial-gradient(circle at 78% 12%, rgba(255, 106, 31, 0.08), transparent 24rem),
        linear-gradient(180deg, #050608 0%, #07090d 50%, #040507 100%);
    }

    .foundry-shell {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    .foundry-backdrop {
      position: absolute;
      inset: -8%;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.88) 76%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.03), transparent 28%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.02) 0 2px, transparent 2px 26px),
        linear-gradient(180deg, #0d1218 0%, #090d12 100%);
      filter: contrast(1.08) brightness(0.8);
      z-index: -3;
    }

    .foundry-backdrop::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 46% 58%, rgba(255, 106, 31, 0.12), transparent 18rem),
        radial-gradient(circle at 52% 52%, rgba(224, 188, 123, 0.08), transparent 12rem);
      mix-blend-mode: screen;
      z-index: -2;
    }

    .foundry-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%),
        radial-gradient(circle at 30% 80%, rgba(255, 255, 255, 0.02), transparent 24rem);
      opacity: 0.45;
      z-index: -1;
    }

    .foundry-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 1rem 1.25rem;
    }

    .foundry-header .nav-row {
      max-width: 1180px;
      margin: 0 auto;
      min-height: 64px;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(88, 104, 118, 0.2);
      border-radius: 999px;
      background: rgba(7, 10, 14, 0.64);
      backdrop-filter: blur(16px);
    }

    .foundry-header .brand-logo {
      width: clamp(172px, 18vw, 244px);
    }

    .foundry-header .top-nav {
      gap: 1rem;
    }

    .foundry-header .top-nav a {
      color: #d8dfe5;
    }

    .foundry-stage {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 7rem 1.25rem 2rem;
    }

    .camera-rig {
      position: relative;
      width: min(1100px, 100%);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(88, 104, 118, 0.35);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 40%, rgba(255, 106, 31, 0.06), transparent 26rem),
        linear-gradient(180deg, rgba(6, 9, 12, 0.68), rgba(5, 7, 10, 0.92));
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transform-origin: center center;
    }

    .camera-rig::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.03), transparent 14%, transparent 86%, rgba(255, 255, 255, 0.03)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 18%, transparent 78%, rgba(0, 0, 0, 0.24));
      pointer-events: none;
      z-index: 14;
    }

    .foundry-shell.play .camera-rig {
      animation: rigPush 7.4s cubic-bezier(0.18, 0.86, 0.28, 1) forwards;
    }

    .workbench {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 52% 64%, rgba(0, 0, 0, 0.2), transparent 12rem),
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 18%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0 2px, transparent 2px 34px),
        linear-gradient(180deg, #11161c 0%, #090c10 100%);
    }

    .smoke-layer,
    .smoke-layer::before,
    .smoke-layer::after {
      position: absolute;
      inset: auto;
      content: "";
      border-radius: 999px;
      filter: blur(24px);
      opacity: 0.16;
      background: radial-gradient(circle, rgba(184, 194, 205, 0.5), transparent 70%);
    }

    .smoke-layer {
      inset: auto;
      left: 12%;
      bottom: 16%;
      width: 22rem;
      height: 10rem;
      z-index: 4;
      animation: smokeDrift 11s ease-in-out infinite alternate;
    }

    .smoke-layer::before {
      left: 55%;
      bottom: 38%;
      width: 14rem;
      height: 7rem;
    }

    .smoke-layer::after {
      left: 82%;
      bottom: 4%;
      width: 18rem;
      height: 7.5rem;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .proof-card {
      position: absolute;
      left: 50%;
      bottom: 12%;
      width: min(560px, 68%);
      min-height: 230px;
      transform: translateX(-50%);
      border-radius: 24px;
      border: 1px solid rgba(214, 168, 79, 0.14);
      background:
        linear-gradient(180deg, rgba(18, 23, 29, 0.96), rgba(10, 14, 20, 0.98)),
        linear-gradient(120deg, rgba(255, 255, 255, 0.04), transparent 34%);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      padding: 1.35rem 1.5rem 1.25rem;
      overflow: hidden;
    }

    .proof-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.02) 12%, transparent 20%),
        radial-gradient(circle at 16% 24%, rgba(255, 255, 255, 0.04), transparent 8rem);
      opacity: 0.4;
      pointer-events: none;
    }

    .proof-card::after {
      content: "";
      position: absolute;
      inset: auto;
      left: 9%;
      top: 20%;
      width: 108px;
      height: 108px;
      background:
        radial-gradient(circle at center, rgba(224, 188, 123, 0.24), rgba(224, 188, 123, 0.06) 48%, transparent 66%);
      opacity: 0;
      transform: scale(0.4);
      border-radius: 50%;
      pointer-events: none;
    }

    .foundry-shell.play .proof-card::after {
      animation: proofSealGlow 1.8s ease-out 1.8s forwards;
    }

    .proof-card-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--foundry-ash);
    }

    .receipt-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.42rem 0.74rem;
      border-radius: 999px;
      border: 1px solid rgba(214, 168, 79, 0.22);
      color: var(--foundry-gold);
      background: rgba(224, 188, 123, 0.08);
    }

    .receipt-lines {
      display: grid;
      gap: 0.72rem;
      width: min(300px, 56%);
      color: rgba(244, 247, 248, 0.88);
      font-size: 0.9rem;
    }

    .receipt-line {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid rgba(88, 104, 118, 0.26);
    }

    .receipt-line span:first-child {
      color: var(--foundry-ash);
    }

    .receipt-seal {
      position: absolute;
      left: 9%;
      top: 20%;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 1px solid rgba(214, 168, 79, 0.28);
      background:
        radial-gradient(circle at center, rgba(224, 188, 123, 0.18), rgba(224, 188, 123, 0.08) 55%, rgba(0, 0, 0, 0.05) 70%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent);
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.45) rotate(-12deg);
      box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.28);
    }

    .receipt-seal img {
      width: 56px;
      height: 56px;
      opacity: 0.86;
      filter: sepia(0.5) saturate(0.85) brightness(0.98);
    }

    .foundry-shell.play .receipt-seal {
      animation: sealReveal 1.35s cubic-bezier(0.17, 0.89, 0.24, 1) 1.72s forwards;
    }

    .stamp-rig {
      position: absolute;
      left: 50%;
      top: 10%;
      width: 220px;
      height: 220px;
      transform: translateX(-50%) translateY(-210px) scale(1.12);
      transform-origin: center center;
      z-index: 11;
      opacity: 0;
      filter: blur(4px);
    }

    .foundry-shell.play .stamp-rig {
      animation: stampStrike 1.2s cubic-bezier(0.12, 0.88, 0.26, 1.12) 0.7s forwards;
    }

    .stamp-glow {
      position: absolute;
      inset: -12%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 106, 31, 0.72) 0%, rgba(255, 106, 31, 0.2) 34%, transparent 68%);
      opacity: 0;
      transform: scale(0.66);
      mix-blend-mode: screen;
    }

    .foundry-shell.play .stamp-glow {
      animation: impactGlow 2.2s ease-out 1.44s forwards;
    }

    .stamp-shadow {
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 170px;
      height: 32px;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(0, 0, 0, 0.58) 0%, transparent 72%);
      filter: blur(10px);
      opacity: 0;
    }

    .foundry-shell.play .stamp-shadow {
      animation: shadowHit 1.2s ease-out 0.7s forwards;
    }

    .stamp-face {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
      background:
        linear-gradient(145deg, rgba(222, 181, 116, 0.96), rgba(123, 82, 39, 0.96) 45%, rgba(51, 34, 18, 0.94) 100%);
      box-shadow:
        inset 0 0 28px rgba(0, 0, 0, 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 18px 30px rgba(0, 0, 0, 0.44);
    }

    .stamp-face::before {
      content: "";
      position: absolute;
      inset: 10px;
      clip-path: inherit;
      background:
        radial-gradient(circle at 50% 32%, rgba(255, 255, 255, 0.16), transparent 26%),
        linear-gradient(160deg, rgba(17, 21, 27, 0.9), rgba(35, 42, 49, 0.88));
      border: 1px solid rgba(224, 188, 123, 0.16);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.42);
    }

    .stamp-face::after {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: inherit;
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.08), transparent 12%),
        radial-gradient(circle at 68% 72%, rgba(0, 0, 0, 0.14), transparent 18%),
        radial-gradient(circle at 52% 48%, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 100%);
      mix-blend-mode: screen;
      opacity: 0.5;
      pointer-events: none;
    }

    .stamp-mark {
      position: relative;
      z-index: 2;
      width: 110px;
      height: 110px;
      filter: brightness(1.2) sepia(0.42) saturate(0.85) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7));
      opacity: 0.96;
    }

    .impact-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 54%, rgba(255, 214, 170, 0.18) 0%, transparent 28%);
      opacity: 0;
      z-index: 9;
      pointer-events: none;
    }

    .foundry-shell.play .impact-flash {
      animation: flashBurst 0.7s ease-out 1.45s forwards;
    }

    #ember-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
      pointer-events: none;
      filter: drop-shadow(0 0 4px rgba(255, 106, 31, 0.48));
    }

    .brand-lockup {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(760px, 82%);
      transform: translateX(-50%);
      text-align: center;
      z-index: 12;
    }

    .brand-kicker {
      margin-bottom: 0.95rem;
      color: var(--foundry-gold);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(14px);
    }

    .wordmark {
      margin: 0;
      display: grid;
      gap: 0.22rem;
      justify-items: center;
      color: #f8fafb;
      font-size: clamp(1.8rem, 5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 0.96;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.56);
    }

    .wordmark .line {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      filter: blur(5px);
    }

    .wordmark .line.tm-line {
      letter-spacing: 0.1em;
    }

    .wordmark .tm {
      font-size: 0.34em;
      vertical-align: top;
      position: relative;
      top: 0.2em;
      color: #b8c0c7;
    }

    .tagline {
      margin-top: 1.15rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      color: var(--foundry-ash);
      font-size: clamp(0.92rem, 1.8vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .tagline span {
      opacity: 0;
      transform: translateY(10px);
      color: #d9e0e6;
    }

    .tagline span:nth-child(2) {
      color: var(--foundry-gold);
      text-shadow: 0 0 12px rgba(224, 188, 123, 0.2);
    }

    .foundry-shell.play .brand-kicker {
      animation: lockupReveal 0.85s ease-out 2.24s forwards;
    }

    .foundry-shell.play .wordmark .line:nth-child(1) {
      animation: lockupReveal 0.8s ease-out 2.48s forwards;
    }

    .foundry-shell.play .wordmark .line:nth-child(2) {
      animation: lockupReveal 0.8s ease-out 2.8s forwards;
    }

    .foundry-shell.play .wordmark .line:nth-child(3) {
      animation: lockupReveal 0.8s ease-out 3.12s forwards;
    }

    .foundry-shell.play .tagline span:nth-child(1) {
      animation: taglineBeat 0.6s ease-out 3.6s forwards;
    }

    .foundry-shell.play .tagline span:nth-child(2) {
      animation: taglineBeat 0.6s ease-out 3.92s forwards;
    }

    .foundry-shell.play .tagline span:nth-child(3) {
      animation: taglineBeat 0.6s ease-out 4.24s forwards;
    }

    .scene-notes {
      position: absolute;
      left: 1.25rem;
      right: 1.25rem;
      bottom: 1.1rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      z-index: 16;
      color: rgba(152, 165, 179, 0.86);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .scene-notes p {
      margin: 0;
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(88, 104, 118, 0.2);
      background: rgba(7, 10, 14, 0.44);
    }

    .controls {
      position: absolute;
      right: 1.25rem;
      top: 6.7rem;
      z-index: 18;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .controls button,
    .controls a {
      appearance: none;
      border: 1px solid rgba(214, 168, 79, 0.24);
      border-radius: 999px;
      background: rgba(10, 14, 20, 0.8);
      color: #e7edf1;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.7rem 1rem;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 150ms ease, color 150ms ease, transform 150ms ease;
      backdrop-filter: blur(12px);
    }

    .controls button:hover,
    .controls a:hover {
      transform: translateY(-1px);
      border-color: rgba(224, 188, 123, 0.64);
      color: var(--foundry-gold);
    }

    @keyframes rigPush {
      from { transform: scale(1); }
      to { transform: scale(1.065); }
    }

    @keyframes smokeDrift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(2%, -4%, 0) scale(1.08); }
    }

    @keyframes stampStrike {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(-210px) scale(1.12);
        filter: blur(4px);
      }
      58% {
        opacity: 1;
        transform: translateX(-50%) translateY(120px) scale(1);
        filter: blur(0);
      }
      72% {
        transform: translateX(-50%) translateY(102px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(112px) scale(1);
        filter: blur(0);
      }
    }

    @keyframes impactGlow {
      0% { opacity: 0; transform: scale(0.66); }
      10% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(1.16); }
    }

    @keyframes shadowHit {
      0% { opacity: 0; transform: translateX(-50%) scale(0.7); }
      58% { opacity: 0.46; transform: translateX(-50%) scale(0.92); }
      100% { opacity: 0.28; transform: translateX(-50%) scale(1); }
    }

    @keyframes flashBurst {
      0% { opacity: 0; }
      12% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes sealReveal {
      0% {
        opacity: 0;
        transform: scale(0.45) rotate(-12deg);
        filter: blur(4px);
      }
      55% {
        opacity: 1;
        transform: scale(1.05) rotate(-2deg);
        filter: blur(0);
      }
      100% {
        opacity: 0.94;
        transform: scale(1) rotate(-4deg);
        filter: blur(0);
      }
    }

    @keyframes proofSealGlow {
      0% { opacity: 0; transform: scale(0.42); }
      18% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.32); }
    }

    @keyframes lockupReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes taglineBeat {
      from {
        opacity: 0;
        transform: translateY(10px);
        filter: blur(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @media (max-width: 960px) {
      .foundry-stage {
        padding-top: 8rem;
      }

      .proof-card {
        width: min(620px, 86%);
        bottom: 9%;
      }

      .receipt-lines {
        width: min(100%, 62%);
      }

      .brand-lockup {
        top: 60%;
        width: min(720px, 90%);
      }
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .foundry-shell {
        min-height: 100dvh;
      }

      .foundry-header {
        position: static;
        padding-bottom: 0;
      }

      .foundry-header .nav-row {
        border-radius: 24px;
      }

      .foundry-header .top-nav {
        display: none;
      }

      .controls {
        position: static;
        margin: 0 auto 1rem;
        padding: 0 1.25rem;
        justify-content: flex-start;
      }

      .foundry-stage {
        min-height: auto;
        padding: 1rem 1rem 2rem;
      }

      .camera-rig {
        aspect-ratio: 4 / 5;
        border-radius: 24px;
      }

      .stamp-rig {
        width: 164px;
        height: 164px;
        top: 11%;
      }

      .stamp-mark {
        width: 82px;
        height: 82px;
      }

      .proof-card {
        bottom: 14%;
        width: calc(100% - 1.5rem);
        min-height: 240px;
        padding: 1rem;
      }

      .receipt-lines {
        width: 100%;
        padding-top: 4.6rem;
      }

      .receipt-seal,
      .proof-card::after {
        left: 1rem;
        top: 1rem;
        width: 86px;
        height: 86px;
      }

      .receipt-seal img {
        width: 46px;
        height: 46px;
      }

      .brand-lockup {
        top: 61%;
        width: calc(100% - 2rem);
      }

      .scene-notes {
        position: static;
        padding: 1rem 0 0;
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="foundry-shell play" id="foundry-shell">
    <div class="foundry-backdrop" aria-hidden="true"></div>

    <header class="site-header foundry-header">
      <div class="container nav-row">
        <a class="brand-lockup" href="/index.html" aria-label="Proof Foundry home">
          <img class="brand-logo" src="/brand/proof-foundry-logo-horizontal.svg" alt="Proof Foundry" />
        </a>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <div class="nav-panel" id="primary-nav">
          <nav class="top-nav" aria-label="Prototype navigation">

    </header>

    <div class="controls">
      <button type="button" id="replay-btn">Replay Sequence</button>
      <a href="/index.html">Back Home</a>

    <main class="foundry-stage">
      <section class="camera-rig" aria-labelledby="foundry-title">
        <div class="workbench" aria-hidden="true"></div>
        <div class="smoke-layer" aria-hidden="true"></div>
        <div class="impact-flash" aria-hidden="true"></div>
        <canvas id="ember-canvas" aria-hidden="true"></canvas>

        <div class="scene">
          <div class="stamp-rig" id="stamp-rig" aria-hidden="true">
            <div class="stamp-glow"></div>
            <div class="stamp-shadow"></div>
            <div class="stamp-face">
              <img class="stamp-mark" src="/brand/proof-foundry-mark.svg" alt="" />
            </div>
          </div>

          <article class="proof-card" aria-label="Proof receipt card">
            <div class="proof-card-top">
              <span>Receipt Surface</span>
              <span class="receipt-chip">Proof Locked</span>
            </div>

            <div class="receipt-seal" aria-hidden="true">
              <img src="/brand/proof-foundry-mark.svg" alt="" />
            </div>

            <div class="receipt-lines">
              <div class="receipt-line">
                <span>Claim</span>
                <strong>Build verified</strong>
              </div>
              <div class="receipt-line">
                <span>Surface</span>
                <strong>Proof card</strong>
              </div>
              <div class="receipt-line">
                <span>Status</span>
                <strong>Stamped in place</strong>
              </div>
            </div>
          </article>

          <div class="brand-lockup">
            <p class="brand-kicker" id="foundry-title">The Foundry Strike</p>
            <h1 class="wordmark">
              <span class="line">THE</span>
              <span class="line">PROOF</span>
              <span class="line tm-line">FOUNDRY<span class="tm">™</span></span>
            </h1>
            <p class="tagline">
              <span>Build it.</span>
              <span>Prove it.</span>
              <span>Ship it.</span>
            </p>
          </div>
        </div>

        <div class="scene-notes" aria-hidden="true">
          <p>Forge the mark</p>
          <p>Stamp the proof</p>
          <p>Lock the identity</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const shell = document.getElementById("foundry-shell");
    const replayButton = document.getElementById("replay-btn");
    const canvas = document.getElementById("ember-canvas");
    const ctx = canvas.getContext("2d");

    let particles = [];
    let rafId = null;
    let sparkTimeoutId = null;

    const IMPACT_MS = 1450;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    class Particle {
      constructor(x, y, isSpark = false) {
        this.x = x ?? Math.random() * canvas.clientWidth;
        this.y = y ?? canvas.clientHeight + Math.random() * 40;
        this.isSpark = isSpark;

        if (isSpark) {
          const angle = (-Math.PI / 2) + ((Math.random() - 0.5) * 1.6);
          const speed = 2.2 + Math.random() * 7.2;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 1 + Math.random() * 2.8;
          this.life = 1;
          this.decay = 0.012 + Math.random() * 0.018;
          const heat = Math.random();
          if (heat > 0.85) {
            this.color = "255,242,196";
          } else if (heat > 0.45) {
            this.color = "255,181,76";
          } else {
            this.color = "255,96,24";
          }
        } else {
          this.vx = (Math.random() - 0.5) * 0.38;
          this.vy = -0.4 - Math.random() * 0.75;
          this.size = 0.6 + Math.random() * 1.8;
          this.life = 0.3 + Math.random() * 0.55;
          this.decay = 0.002 + Math.random() * 0.004;
          this.color = Math.random() > 0.5 ? "255,128,42" : "214,168,79";
        }
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;

        if (this.isSpark) {
          this.vy += 0.1;
          this.vx *= 0.985;
          this.vy *= 0.988;
        } else {
          this.vx += (Math.random() - 0.5) * 0.03;
        }
      }

      draw() {
        if (this.life <= 0) {
          return;
        }

        ctx.beginPath();
        ctx.fillStyle = `rgba(${this.color}, ${Math.max(this.life, 0)})`;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function seedEmbers(count = 36) {
      particles = [];
      for (let i = 0; i < count; i += 1) {
        particles.push(new Particle());
      }
    }

    function triggerSparks() {
      const stamp = document.getElementById("stamp-rig");
      const stage = canvas.getBoundingClientRect();
      const rect = stamp.getBoundingClientRect();
      const originX = rect.left - stage.left + (rect.width / 2);
      const originY = rect.top - stage.top + rect.height - 38;

      for (let i = 0; i < 70; i += 1) {
        particles.push(new Particle(originX, originY, true));
      }
    }

    function animateEmbers() {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      const ambientCount = particles.filter((particle) => !particle.isSpark).length;
      if (ambientCount < 34) {
        particles.push(new Particle());
      }

      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.update();
        particle.draw();

        if (
          particle.life <= 0 ||
          particle.y < -24 ||
          particle.x < -24 ||
          particle.x > canvas.clientWidth + 24
        ) {
          particles.splice(i, 1);
        }
      }

      rafId = requestAnimationFrame(animateEmbers);
    }

    function playSequence() {
      window.clearTimeout(sparkTimeoutId);
      shell.classList.remove("play");
      void shell.offsetWidth;
      seedEmbers();
      shell.classList.add("play");
      sparkTimeoutId = window.setTimeout(triggerSparks, IMPACT_MS);
    }

    replayButton.addEventListener("click", playSequence);
    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    seedEmbers();
    animateEmbers();
    playSequence();
  </script>
  <script src="/site.js" defer></script>
</body>
