# Cloudflare Pages config for the direct-upload workflow.
# deploy.ps1 rebuilds public/ and then runs:
#   npx --yes wrangler pages deploy .\public --project-name proof-foundry-site --branch main

name = "proof-foundry-site"
compatibility_date = "2026-06-30"
pages_build_output_dir = "public"

# R2 binding for the /downloads/* Pages Function (functions/downloads/[[path]].js).
# Serves release artifacts that exceed the Pages 25 MiB static-file cap.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "proof-foundry-downloads"
