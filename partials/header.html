<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header" id="top">
  <div class="container nav-row">
    <a class="brand-lockup" href="/" aria-label="Proof Foundry home">
      <picture>
        <source media="(max-width: 640px)" srcset="/brand/proof-foundry-mark.svg" />
        <img class="brand-logo" src="/brand/proof-foundry-logo-horizontal.svg" alt="Proof Foundry" />
      </picture>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <!-- Wrapper so the links and the CTA collapse into one dropdown panel on mobile
         instead of the CTA wrapping onto a second header row. -->
    <div class="nav-panel" id="primary-nav">
      <nav class="top-nav" aria-label="Primary navigation">
        {{nav-links}}
      </nav>
      {{nav-cta}}
    </div>
  </div>
</header>
