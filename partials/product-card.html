<article class="product-card product-{{state}} card-{{id}}" data-status="{{visitorStatusSlug}}">
  <figure class="card-shot">
    <img src="{{cardImage}}" alt="{{cardImageAlt}}" loading="lazy" decoding="async" />
  </figure>
  <div class="card-body">
    <div class="card-head">
      {{markSvg}}
      <h4 class="card-name"><a href="{{route}}">{{name}}</a></h4>
      <span class="card-badge badge-{{visitorStatusSlug}}">{{visitorStatusLabel}}</span>
    </div>
    <p class="card-value">{{valueLine}}</p>
    <p class="card-facts">
      <!-- @if-version --><span class="card-version">{{cardVersionLabel}}</span><!-- @end-version --><span class="card-platform">{{platform}}</span>
    </p>
    <div class="card-actions">
      <a class="button button-primary button-sm card-cta" href="{{cardCtaHref}}">{{cardCta}}</a>
      <a class="card-proof-link" href="{{cardProofHref}}">Verification record</a>
    </div>
    <!-- @if-detail --><p class="card-detail">{{cardDetailLine}}</p><!-- @end-detail -->
  </div>
</article>
