<article class="product-card card-{{id}}" style="{{moduleCardTheme}}" data-status="{{visitorStatusSlug}}" data-product="{{id}}" data-category="{{moduleCategory}}" data-jobs="{{moduleJobKeys}}" data-scene-family="{{moduleSceneFamily}}">
<a class="catalog-image-link" href="{{route}}" aria-label="Explore {{homeName}}"><img src="{{cardImage}}" alt="{{cardImageAlt}}" width="{{cardImageWidth}}" height="{{cardImageHeight}}" loading="lazy" decoding="async"></a>
<div class="card-body"><div class="card-head">{{markSvg}}<h4 class="card-name"><a href="{{route}}">{{homeName}}</a></h4></div><p class="card-value">{{valueLine}}</p><p class="card-summary">{{moduleSummary}}</p><div class="h9-card-meta"><span class="card-platform">{{platform}}</span><span class="card-availability" data-availability="{{visitorStatusSlug}}"><i aria-hidden="true"></i>{{visitorStatusLabel}}</span><!-- @if-version --><span class="card-version">{{cardVersionLabel}}</span><!-- @end-version --></div><!-- @commerce-badge --><div class="card-bottom"><a class="card-explore" href="{{route}}">{{cardCta}} <svg class="ui-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 13 13 3M5 3h8v8"/></svg></a></div><!-- @if-detail --><details class="card-more"><summary>Details</summary><p class="card-detail">{{cardDetailLine}}</p></details><!-- @end-detail --><label class="compare-choice" data-compare="{{id}}" data-enhance hidden><input type="checkbox" aria-label="Compare {{homeName}}"><span>Compare</span></label></div></article>
