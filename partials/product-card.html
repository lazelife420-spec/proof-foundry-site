<article class="product-card card-{{id}}" data-status="{{visitorStatusSlug}}" data-product="{{id}}">
<div class="card-topline"><span class="card-platform">{{platform}}</span><span class="card-availability" data-availability="{{visitorStatusSlug}}"><i aria-hidden="true"></i>{{visitorStatusLabel}}</span></div>
<a class="catalog-image-link" href="{{route}}" aria-label="Explore {{homeName}}"><img src="{{cardImage}}" alt="{{cardImageAlt}}" width="{{cardImageWidth}}" height="{{cardImageHeight}}" loading="lazy" decoding="async"></a>
<div class="card-body"><div class="card-head">{{markSvg}}<h4 class="card-name"><a href="{{route}}">{{homeName}}</a></h4></div><p class="card-value">{{valueLine}}</p><div class="card-bottom"><a class="card-explore" href="{{route}}">{{cardCta}} <span aria-hidden="true">↗</span></a><!-- @if-version --><span class="card-version">Public {{cardVersionLabel}}</span><!-- @end-version --></div><!-- @if-detail --><p class="card-detail">{{cardDetailLine}}</p><!-- @end-detail --><label class="compare-choice" data-compare="{{id}}" data-enhance hidden><input type="checkbox" aria-label="Compare {{homeName}}"><span>Compare</span></label></div></article>
