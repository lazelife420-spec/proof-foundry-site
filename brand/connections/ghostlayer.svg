 <path class="joint-cut" d="m174 62 28 4-4 15-26-4z" fill="url(#ghostlayer-satin)"/>
 <path class="joint-inlay" d="m176 88 45 7" stroke="url(#ghostlayer-brass)" stroke-width="2"/>
 <g class="joint-fasteners" fill="#0d1b20" stroke="#a9bcb7"><circle cx="19" cy="77" r="3"/><circle cx="196" cy="97" r="3"/><path d="m17 77h4m173 20h4"/></g>
</g>
