  <linearGradient id="ghostlayer-cut" x1="20" y1="18" x2="192" y2="141" gradientUnits="userSpaceOnUse"><stop stop-color="#ecede5"/><stop offset=".3" stop-color="#a9b4b3"/><stop offset=".62" stop-color="#596971"/><stop offset="1" stop-color="#152229"/></linearGradient>
