 <g class="joint-sheet joint-sheet--front"><path class="joint-glass" d="m32 48 126 19-18 84-125-20z" fill="url(#ghostlayer-glass)" stroke="#c5d8cc" stroke-width="1.4"/><path class="joint-cut" d="m32 48 126 19-2 8L30 56z" fill="url(#ghostlayer-satin)"/><path class="joint-recess" d="m44 77 89 14-2 6-89-14zM40 94l63 10-2 6-63-10z" fill="#14272a" fill-opacity=".7"/></g>
 <path class="joint-body" d="M5 67h34v22H23v17H5z" fill="url(#ghostlayer-graphite)" stroke="#94a7a8"/>
