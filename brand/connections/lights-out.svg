<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" class="joint-svg joint-svg--lights-out" aria-hidden="true" focusable="false" fill="none">
<defs>
  <linearGradient id="lights-out-satin" x1="34" y1="24" x2="180" y2="144" gradientUnits="userSpaceOnUse"><stop stop-color="#d1d6d4"/><stop offset=".23" stop-color="#889397"/><stop offset=".48" stop-color="#bac3c3"/><stop offset=".55" stop-color="#707d82"/><stop offset="1" stop-color="#414e55"/></linearGradient>
  <linearGradient id="lights-out-graphite" x1="48" y1="20" x2="166" y2="143" gradientUnits="userSpaceOnUse"><stop stop-color="#414c50"/><stop offset=".22" stop-color="#232d32"/><stop offset=".73" stop-color="#111a20"/><stop offset="1" stop-color="#28353b"/></linearGradient>
  <linearGradient id="lights-out-cut" x1="20" y1="18" x2="192" y2="141" gradientUnits="userSpaceOnUse"><stop stop-color="#ecede5"/><stop offset=".3" stop-color="#a9b4b3"/><stop offset=".62" stop-color="#596971"/><stop offset="1" stop-color="#152229"/></linearGradient>
  <linearGradient id="lights-out-brass" x1="59" y1="35" x2="166" y2="115" gradientUnits="userSpaceOnUse"><stop stop-color="#e0c994"/><stop offset=".45" stop-color="#a88b54"/><stop offset=".6" stop-color="#c2a46c"/><stop offset="1" stop-color="#655236"/></linearGradient>
  <linearGradient id="lights-out-ceramic" x1="60" y1="28" x2="168" y2="127" gradientUnits="userSpaceOnUse"><stop stop-color="#f4f4e9"/><stop offset=".48" stop-color="#ced8d3"/><stop offset="1" stop-color="#8b9e99"/></linearGradient>
  <linearGradient id="lights-out-glass" x1="48" y1="27" x2="189" y2="133" gradientUnits="userSpaceOnUse"><stop stop-color="#d3e4dd" stop-opacity=".55"/><stop offset=".45" stop-color="#678b86" stop-opacity=".24"/><stop offset="1" stop-color="#bfd4cd" stop-opacity=".38"/></linearGradient>
  <pattern id="lights-out-grain" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 .5H3" stroke="#f4f4df" stroke-opacity=".055" stroke-width=".45"/></pattern>
  <filter id="lights-out-shadow" x="-15%" y="-20%" width="140%" height="160%"><feDropShadow dx="1" dy="7" stdDeviation="4" flood-color="#02080b" flood-opacity=".5"/></filter>
