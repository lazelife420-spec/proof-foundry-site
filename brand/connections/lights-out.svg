  <path class="joint-cut" d="m175 34 23 20-4 8-25-21z" fill="url(#lights-out-cut)"/>
  <circle cx="183" cy="54" r="5" fill="#0c171f" stroke="#bec8c8"/>
 </g>
 <g class="joint-fasteners" fill="#0d171f" stroke="#8b9aa1"><circle cx="58" cy="82" r="3"/><circle cx="121" cy="133" r="3"/><path d="M56 82h4m59 51h4"/></g>
 <path class="joint-mating" d="M186 101h25v13h-30z" fill="url(#lights-out-graphite)" stroke="#88979e"/>
</g>
</svg>
