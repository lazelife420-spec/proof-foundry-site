<!-- An open, mass-balanced collar; the counterweight seats without turning the content. -->
<g class="joint-assembly" filter="url(#lights-out-shadow)">
 <path class="joint-body" d="M6 72h42v19H6zm178 0h50v19h-50z" fill="url(#lights-out-graphite)" stroke="#6d7c83"/>
 <path class="joint-cut" d="M17 74h28v3H17m179-3h27v3h-27" stroke="#b6c2c3" stroke-width="2"/>
 <g class="joint-collar">
  <path class="joint-body" d="M174 36a62 62 0 1 0 1 88l-17-17a38 38 0 1 1-1-53z" fill="url(#lights-out-graphite)" stroke="url(#lights-out-cut)" stroke-width="2"/>
  <path class="joint-cut" d="M163 39a55 55 0 1 0 2 78l-6-6a46 46 0 1 1-2-65z" fill="url(#lights-out-satin)" opacity=".9"/>
  <path class="joint-body" d="M151 51a38 38 0 1 0 1 58l-8-9a26 26 0 1 1-1-39z" fill="#0d171f" stroke="#a6b5bc" stroke-width="1"/>
  <path class="joint-inlay" d="M83 37a49 49 0 0 0-20 35" stroke="url(#lights-out-brass)" stroke-width="2.4" stroke-linecap="round"/>
 </g>
 <g class="joint-counterweight">
